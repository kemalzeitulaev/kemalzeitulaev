<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Crystal Dash — Kemal.OS</title>
  <style>
    :root { --bg:#070b0d; --cyan:#3dffc8; --line:#2d6b66; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: #e8f4f1; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow: hidden; touch-action: none; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; font-size: 14px; text-shadow: 0 1px 8px #000; z-index: 2; }
    .hud b { color: var(--cyan); }
    .hint { position: fixed; top: 42px; left: 16px; right: 16px; text-align: center; color: #9ec9c2; font-size: 12px; pointer-events: none; z-index: 2; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 8, 10, 0.55); z-index: 3; }
    .overlay.hidden { display: none; }
    .card { width: min(420px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; background: #102226; text-align: center; }
    .card h1 { color: var(--cyan); letter-spacing: 3px; font-size: 28px; margin-bottom: 10px; }
    .card p { color: #9ec9c2; font-size: 13px; line-height: 1.55; margin-bottom: 18px; }
    button { appearance: none; border: 1px solid var(--cyan); background: #102226; color: var(--cyan); padding: 12px 22px; border-radius: 10px; font: inherit; letter-spacing: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div>SCORE <b id="score">0</b></div>
    <div>BEST <b id="best">0</b></div>
  </div>
  <div class="hint" id="hint">KEMAL.OS // стрелки или тап по сторонам</div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h1>CRYSTAL DASH</h1>
      <p id="msg">Лови бирюзовые кристаллы, уворачивайся от камней. Клик или пробел — старт.</p>
      <button id="start" type="button">PLAY</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const msg = document.getElementById("msg");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const startBtn = document.getElementById("start");
    const bestKey = "crystal-dash-best";
    let best = 0;
    try { best = Number(localStorage.getItem(bestKey) || 0); } catch (e) {}
    bestEl.textContent = best;

    let W = 0, H = 0, running = false, raf = 0, last = 0, spawnT = 0;
    const state = { score: 0, speed: 1, playerX: 0.5, items: [], stars: [] };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function reset() {
      state.score = 0;
      state.speed = 1;
      state.playerX = 0.5;
      state.items = [];
      spawnT = 0;
      state.stars = Array.from({ length: 50 }, () => ({
        x: Math.random(), y: Math.random() * 0.55, r: Math.random() * 1.6 + 0.4, o: Math.random()
      }));
      scoreEl.textContent = "0";
      for (let i = 0; i < 3; i++) spawn("crystal", -0.12 - i * 0.18);
    }

    function spawn(kind, y) {
      let x = 0.12 + Math.random() * 0.76;
      if (kind === "rock") {
        for (let i = 0; i < 8 && Math.abs(x - state.playerX) < 0.2; i++) x = 0.12 + Math.random() * 0.76;
      }
      state.items.push({ kind, x, y: y == null ? -0.1 : y });
    }

    function step(dt) {
      state.speed = 1 + state.score / 40;
      spawnT += dt;
      if (spawnT > Math.max(0.32, 0.7 - state.score * 0.008)) {
        spawnT = 0;
        const kind = state.score < 30 || Math.random() < 0.72 ? "crystal" : "rock";
        spawn(kind);
      }
      const hitR = 0.0024;
      state.items = state.items.filter((item) => {
        item.y += dt * 0.32 * state.speed;
        const dx = item.x - state.playerX;
        const dy = item.y - 0.82;
        const hit = dx * dx + dy * dy < hitR;
        if (hit && item.kind === "crystal") {
          state.score += 10;
          scoreEl.textContent = String(state.score);
          return false;
        }
        if (hit && item.kind === "rock") {
          gameOver();
          return false;
        }
        return item.y < 1.12;
      });
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#16343d");
      g.addColorStop(0.5, "#2a5a58");
      g.addColorStop(1, "#c9a15a");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(243,226,168,0.92)";
      ctx.beginPath();
      ctx.arc(W * 0.82, H * 0.16, 40, 0, Math.PI * 2);
      ctx.fill();
      for (const s of state.stars) {
        ctx.globalAlpha = 0.35 + s.o * 0.65;
        ctx.fillStyle = "#e8f6f4";
        ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(141,106,56,0.6)";
      ctx.beginPath();
      ctx.moveTo(0, H * 0.7);
      ctx.quadraticCurveTo(W * 0.3, H * 0.6, W * 0.55, H * 0.68);
      ctx.quadraticCurveTo(W * 0.8, H * 0.76, W, H * 0.64);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.fill();

      for (const item of state.items) {
        const x = item.x * W;
        const y = item.y * H;
        if (item.kind === "crystal") {
          ctx.fillStyle = "#3dffc8";
          ctx.beginPath();
          ctx.moveTo(x, y - 16);
          ctx.lineTo(x + 11, y);
          ctx.lineTo(x, y + 16);
          ctx.lineTo(x - 11, y);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = "#6d5330";
          ctx.beginPath();
          ctx.ellipse(x, y, 16, 12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#d7c4a1";
          ctx.beginPath();
          ctx.ellipse(x - 4, y - 3, 7, 4, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const px = state.playerX * W;
      const py = H * 0.82;
      ctx.fillStyle = "#1b2830";
      ctx.strokeStyle = "#3dffc8";
      ctx.lineWidth = 2;
      roundRect(px - 34, py - 10, 68, 24, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#2b6aa3";
      roundRect(px - 18, py - 22, 36, 14, 4);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.beginPath(); ctx.arc(px - 18, py + 14, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 18, py + 14, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#3dffc8";
      ctx.beginPath(); ctx.arc(px - 18, py + 14, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 18, py + 14, 2.4, 0, Math.PI * 2); ctx.fill();
    }

    function loop(ts) {
      if (!running) return;
      const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
      last = ts;
      step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }

    function start() {
      overlay.classList.add("hidden");
      reset();
      running = true;
      last = performance.now();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      if (state.score > best) {
        best = state.score;
        try { localStorage.setItem(bestKey, String(best)); } catch (e) {}
        bestEl.textContent = best;
      }
      msg.textContent = "Пустыня догнала. Счёт: " + state.score + ". Рекорд: " + best + ". Нажми PLAY.";
      overlay.classList.remove("hidden");
    }

    function moveTo(ratio) {
      state.playerX = Math.max(0.08, Math.min(0.92, ratio));
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") state.playerX = Math.max(0.08, state.playerX - 0.08);
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") state.playerX = Math.min(0.92, state.playerX + 0.08);
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        if (!running) start();
      }
    });
    window.addEventListener("pointerdown", (e) => {
      if (!running) {
        start();
        return;
      }
      moveTo(e.clientX / window.innerWidth);
    });
    window.addEventListener("pointermove", (e) => {
      if (running && e.buttons) moveTo(e.clientX / window.innerWidth);
    });
    startBtn.addEventListener("click", (e) => { e.stopPropagation(); start(); });
    window.addEventListener("resize", () => { resize(); draw(); });
    resize();
    reset();
    draw();
    start();
  </script>
</body>
</html>
