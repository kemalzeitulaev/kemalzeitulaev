<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Crystal Dash screensaver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071014"/>
      <stop offset="55%" stop-color="#10242a"/>
      <stop offset="100%" stop-color="#1c3a2e"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#7a5a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dffc8"/>
      <stop offset="100%" stop-color="#7ad7ff"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8fff7"/>
      <stop offset="45%" stop-color="#3dffc8"/>
      <stop offset="100%" stop-color="#128f7a"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7c4a1"/>
      <stop offset="100%" stop-color="#6d5330"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screen">
      <rect x="18" y="16" width="1164" height="228" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="260" fill="#05080a"/>
  <rect x="18" y="16" width="1164" height="228" rx="16" fill="url(#bg)" stroke="#2d6b66" stroke-width="2"/>

  <g clip-path="url(#screen)">
    <circle cx="980" cy="46" r="34" fill="#f3e2a8" opacity="0.9"/>
    <circle cx="980" cy="46" r="58" fill="#f3e2a8" opacity="0.12" filter="url(#soft)"/>

    <g fill="#d7eef0" opacity="0.85">
      <circle cx="70" cy="40" r="1.2">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="28" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="48" r="1.3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="22" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="36" r="1.1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="24" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="42" r="1"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M18 214 C 140 188 260 200 380 192 C 520 182 640 210 780 196 C 920 182 1040 206 1182 188 L 1182 244 L 18 244 Z" fill="url(#dune)" opacity="0.55"/>
    <path d="M18 228 C 180 214 340 232 500 220 C 700 204 900 236 1182 218 L 1182 244 L 18 244 Z" fill="#8d6a38" opacity="0.7"/>

    <!-- falling crystals -->
    <g filter="url(#glow)">
      <g>
        <polygon points="0,-12 8,0 0,12 -8,0" fill="url(#crystal)"/>
        <animateTransform attributeName="transform" type="translate" values="220,-20; 232,210" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <polygon points="0,-10 7,0 0,10 -7,0" fill="url(#crystal)"/>
        <animateTransform attributeName="transform" type="translate" values="410,-30; 390,215" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <polygon points="0,-14 9,0 0,14 -9,0" fill="url(#crystal)"/>
        <animateTransform attributeName="transform" type="translate" values="620,-24; 640,212" dur="3.8s" begin="1s" repeatCount="indefinite"/>
      </g>
      <g>
        <polygon points="0,-11 7.5,0 0,11 -7.5,0" fill="url(#crystal)"/>
        <animateTransform attributeName="transform" type="translate" values="800,-18; 776,214" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
      </g>
      <g>
        <polygon points="0,-9 6,0 0,9 -6,0" fill="url(#crystal)"/>
        <animateTransform attributeName="transform" type="translate" values="980,-22; 1004,216" dur="3.4s" begin="1.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- rocks -->
    <g>
      <ellipse rx="13" ry="9" fill="url(#rock)"/>
      <animateTransform attributeName="transform" type="translate" values="300,-20; 288,220" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse rx="11" ry="8" fill="url(#rock)"/>
      <animateTransform attributeName="transform" type="translate" values="720,-24; 742,222" dur="4.1s" begin="1.8s" repeatCount="indefinite"/>
    </g>

    <!-- player rover -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="260,196; 520,196; 780,196; 540,196; 260,196" dur="6.5s" repeatCount="indefinite"/>
      <rect x="-22" y="-8" width="44" height="14" rx="4" fill="#1b2830" stroke="#3dffc8" stroke-width="1.5"/>
      <rect x="-14" y="-16" width="28" height="10" rx="3" fill="#2b6aa3"/>
      <circle cx="-14" cy="8" r="5" fill="#111"/><circle cx="-14" cy="8" r="2" fill="#3dffc8"/>
      <circle cx="14" cy="8" r="5" fill="#111"/><circle cx="14" cy="8" r="2" fill="#3dffc8"/>
      <polygon points="0,-22 6,-16 -6,-16" fill="#3dffc8"/>
    </g>

    <!-- HUD -->
    <text x="40" y="48" fill="url(#neon)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="3">CRYSTAL DASH</text>
    <text x="40" y="70" fill="#9ec9c2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">SCREENSAVER  ·  CATCH CRYSTALS  ·  DODGE ROCKS</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="40" y="118" fill="#7f8b8a" font-size="10">SCORE</text>
      <text x="40" y="140" fill="#3dffc8" font-size="26" font-weight="700">
        1280
        <animate attributeName="opacity" values="1;0.55;1" dur="1.2s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="118" fill="#7f8b8a" font-size="10">BEST</text>
      <text x="140" y="140" fill="#f3c56b" font-size="26" font-weight="700">3400</text>
    </g>

    <g transform="translate(980,188)">
      <rect x="0" y="0" width="168" height="36" rx="8" fill="#102226" stroke="#3dffc8" stroke-width="1.5"/>
      <text x="84" y="24" text-anchor="middle" fill="#3dffc8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">PLAY</text>
    </g>

    <!-- scanlines -->
    <g opacity="0.07">
      <line x1="18" y1="40" x2="1182" y2="40" stroke="#fff"/>
      <line x1="18" y1="70" x2="1182" y2="70" stroke="#fff"/>
      <line x1="18" y1="100" x2="1182" y2="100" stroke="#fff"/>
      <line x1="18" y1="130" x2="1182" y2="130" stroke="#fff"/>
      <line x1="18" y1="160" x2="1182" y2="160" stroke="#fff"/>
      <line x1="18" y1="190" x2="1182" y2="190" stroke="#fff"/>
      <line x1="18" y1="220" x2="1182" y2="220" stroke="#fff"/>
    </g>
  </g>
</svg>
